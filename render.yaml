services:
  - type: web
    name: todolistapp
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install && cd ../frontend && NODE_ENV=development npm install --legacy-peer-deps && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
